name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests jobs scripts app
      - name: Unit tests
        run: pytest -q
      - name: FL smoke test (2 clients, 2 rounds) + offline case agent on its model
        run: |
          python scripts/make_synthetic.py --out data/synthetic --n-patients 300
          python jobs/fedavg_job.py --data data/synthetic --n-clients 2 --rounds 2 --local-epochs 1 \
            --save outputs/fedavg.pt
          python -m muffle.report.nemotron --agent --ckpt outputs/fedavg.pt --data data/synthetic
