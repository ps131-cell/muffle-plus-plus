<!doctype html>
<!-- The slide viewer of the pathology workbench (app/workbenches/slide_viewer.py): OpenSeadragon
     6.1.1 (BSD-3-Clause, openseadragon-LICENSE.txt) over the section's Deep Zoom tiles, with the
     analysis drawn on a canvas above it (viewer.js). No build step. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --ink: #262730; --muted: #6b6f76; --line: #d5d8dc; --chip: #f4f5f6; --accent: #2a78d6; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--ink);
               font: 13px/1.4 "Source Sans Pro", "Source Sans 3", system-ui, sans-serif; }
  body.dark { --ink: #fafafa; --muted: #a3a8b4; --line: #3d4048; --chip: #262730; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 4px 0 6px; }
  #bar label { white-space: nowrap; cursor: pointer; }
  #bar select, #bar input[type=range] { vertical-align: middle; }
  select { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line);
           border-radius: 4px; padding: 1px 4px; max-width: 260px; }
  .group { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .hint { color: var(--muted); }
  #wrap { display: flex; gap: 8px; }
  .pane { position: relative; flex: 1 1 0; min-width: 0; border: 1px solid var(--line);
          border-radius: 6px; overflow: hidden; background: #f2f2f2; }
  .osd { position: absolute; inset: 0; }
  .head { position: absolute; left: 6px; top: 6px; z-index: 5; display: flex; gap: 6px;
          align-items: center; background: rgba(255, 255, 255, .88); color: #262730;
          border-radius: 4px; padding: 2px 6px; max-width: calc(100% - 200px); }
  .head b { white-space: nowrap; }
  .head select { background: #fff; color: #262730; border-color: #c8ccd0; max-width: 170px; }
  .msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
         text-align: center; padding: 20px; color: #7b241c; background: rgba(255, 255, 255, .9);
         z-index: 6; }
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 340px;
         background: rgba(32, 33, 36, .94); color: #fff; border-radius: 5px; padding: 6px 8px;
         font-size: 12px; line-height: 1.35; }
  #tip i { color: #c9d1d9; }
  #legend { padding: 6px 0 0; color: var(--muted); font-size: 12px; }
  #legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px;
                vertical-align: -1px; margin: 0 3px 0 8px; border: 1px solid rgba(0,0,0,.2); }
  #legend .row { margin-top: 2px; }
</style>
</head>
<body>
<div id="bar">
  <label>Colour tiles by
    <select id="fill">
      <option value="none">nothing (tissue only)</option>
      <option value="tissue" selected>tissue class</option>
      <option value="certainty">certainty</option>
      <option value="qc">quality control</option>
      <option value="zones">zones</option>
      <option value="immune">lymphocyte-like nuclei</option>
      <option value="til">lymphocytes (second model)</option>
      <option value="risk">risk level</option>
    </select>
  </label>
  <label>opacity <input id="alpha" type="range" min="0.1" max="0.8" step="0.05" value="0.35"></label>
  <span class="group" id="toggles"></span>
  <label id="linkbox" style="display:none"><input type="checkbox" id="link" checked> link pan and zoom</label>
  <span class="hint">click a tile: Spot panel · n / p: next or previous pointer · scroll or double-click: zoom</span>
</div>
<div id="wrap"></div>
<div id="legend"></div>
<div id="tip"></div>
<script src="openseadragon.min.js?v=6.1.1"></script>
<script src="viewer.js?v=4"></script>
</body>
</html>
